name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.1'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.1'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Check test coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.txt | grep total | awk '{print $3}' | sed 's/%//')
          echo "Test coverage: ${COVERAGE}%"
          if (( $(echo "${COVERAGE} < 80" | bc -l) )); then
            echo "❌ Test coverage ${COVERAGE}% is below required 80%"
            exit 1
          else
            echo "✅ Test coverage ${COVERAGE}% meets requirement"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.1'

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: ./scripts/build.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Check binary size
        run: |
          SIZE=$(stat -c%s bin/pfsense-dhcp-updater)
          SIZE_MB=$(echo "scale=2; ${SIZE} / 1024 / 1024" | bc)
          echo "Binary size: ${SIZE_MB}MB"
          if (( $(echo "${SIZE_MB} > 10" | bc -l) )); then
            echo "❌ Binary size ${SIZE_MB}MB exceeds 10MB limit"
            exit 1
          else
            echo "✅ Binary size ${SIZE_MB}MB is within limit"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v3
        with:
          name: pfsense-dhcp-updater
          path: bin/pfsense-dhcp-updater
